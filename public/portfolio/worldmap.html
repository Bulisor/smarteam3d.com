	<body>   
		<canvas id="canvas" style="touch-action:none"></canvas>
		<script>
			var infos = {
				0:{
					"coords":[29.649, -98.34],
					"label":"House - by wilk-bartek",
					"resource":"house"
				},
				1:{  
					"coords":[29.504, 8.553], 
					"label":"Huntercabin - by shadedancer619",
					"resource":"huntercabin"
				},
				2:{
					"coords":[35.652, 5.632],
					"label":"Environment - by pabong",
					"resource":"env"
				},
				3:{
					"coords":[15.652, 15.632],
					"label":"Helicopter - by edson",
					"resource":"helicopter"
				}
			}
		</script>
		
		<div id="mapid"></div>
		<div id="coords"></div>
		<div id="basemaps-wrapper" class="leaflet-bar">
		  <select name="basemaps" id="basemaps" onChange="changeBasemap(basemaps)">
			<option value="Imagery">Imagery</option>
			<option value="Topographic">Topographic</option>
			<option value="Streets">Streets</option>
			<option value="Gray">Gray</option>
			<option value="DarkGray">Dark Gray</option>
			<option value="ShadedRelief">Shaded Relief</option>
		  </select>
		</div>
		
		<script>
			var maxLabelZ = {
				"Imagery" : 17,
				"Topographic" : 18,
				"Streets" : 18,
				"Gray" : 16,
				"DarkGray" : 16,
				"ShadedRelief" : 11,
			}
			var mapid = document.getElementById("mapid");
			var select = document.getElementById("basemaps-wrapper");
			
			var map = null, marker = null, layer = null;
			var coords = [30, 30], baseMap = "Imagery", hasObj3D = -1;
			function create_map(coords){
				BBjs = false;
				if(!map){    
					map = L.map('mapid', { center: [coords[0], coords[1]], zoom: 4, minZoom: 2, maxZoom: 18 });
					map.setView([coords[0], coords[1]], 4);
					
					layer = L.esri.basemapLayer(baseMap, {detectRetina: true}).addTo(map);
					marker = L.marker(map.getCenter()).addTo(map);
					
					//on max zoom init bbjs map 
					map.on('zoom', function (e) {
						if(map._zoom > maxLabelZ[baseMap])
							map.setZoom(maxLabelZ[baseMap]); 
						if(map._zoom == maxLabelZ[baseMap]) {
						
							var center = map.getCenter();
							coords = [center.lat, center.lng];
							map.setZoom(maxLabelZ[baseMap]-1);   
							var extent = map.getBounds(); 
							var dimensions = [window.innerWidth, window.innerHeight];
							var mapurl = layer._url.toString().replace("/tile/{z}/{y}/{x}", "").replace("{s}", "services");
							
							initBBjsScene(dimensions, extent, mapurl, coords, hasObj3D);
							hasObj3D = -1;
							
							mapid.style.display = "none";
							select.style.display = "none";
						}  
					});  
					
					//enable search
					var searchControl = L.esri.Geocoding.geosearch().addTo(map);
					searchControl.on('results', function(data){
						for (var i = data.results.length - 1; i >= 0; i--) { 
							marker.setLatLng(data.results[i].latlng).update(); 
						}
					});
				
					var layerGroup = L.layerGroup().addTo(map);
					var pin = L.icon({
						iconUrl: '/assets/portfolio/worldmap/orange_pin.png',
						iconSize: [32, 32],
						iconAnchor: [10, 10],
						labelAnchor: [6, 0] 
					});
					for (i = 0; i < Object.keys(infos).length; i++) {
						var marker3D = L.marker([infos[i]["coords"][0], infos[i]["coords"][1]], {icon: pin, res:i}).bindTooltip(infos[i]["label"], {offset: [15,0], direction: "right"}); 
						marker3D.on('click', function onClick(e) { map.flyTo([this.getLatLng().lat, this.getLatLng().lng], maxLabelZ[baseMap]); hasObj3D = this.options.res; });
						layerGroup.addLayer(marker3D);
					}
					
				}else{ 
					var newLatLng = new L.LatLng(coords[0],coords[1]);
					marker.setLatLng(newLatLng).update(); 
					map.setView(coords, maxLabelZ[baseMap]-1);
				}
			}
			
			//change layer on leaflet
			var layerLabels;

			function setBasemap(basemap) {
				if (layer) 
				  map.removeLayer(layer);
				
				layer = L.esri.basemapLayer(basemap);

				map.addLayer(layer);

				if(map._zoom>maxLabelZ[baseMap]){
					map.setZoom(maxLabelZ[baseMap] - 1);
					console.log("da")
				}
					
					
				if (layerLabels) 
				  map.removeLayer(layerLabels);
				
				if (basemap === 'ShadedRelief'
				 || basemap === 'Oceans'
				 || basemap === 'Gray'
				 || basemap === 'DarkGray'
				 || basemap === 'Imagery'
				 || basemap === 'Terrain'
				) {
				  layerLabels = L.esri.basemapLayer(basemap + 'Labels');
				  map.addLayer(layerLabels);
				}
			}

			function changeBasemap(basemaps){
				baseMap = basemaps.value;
				setBasemap(baseMap);
				if(BBjs){
					changeBBjsText(baseMap);
				}
			}

			//auto geolocation on begin
			function getLocation() {
				if (navigator.geolocation) {
					navigator.geolocation.getCurrentPosition(function(pos){
						coords = [pos.coords.latitude, pos.coords.longitude];
						create_map(coords);
					},
					function(){ 
						create_map(coords);
					});
				}else{
					create_map(coords);
				}
			}
			
			getLocation();
		</script>
