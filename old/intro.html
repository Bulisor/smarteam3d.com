<!DOCTYPE html><html lang="en">	<head> 		<meta charset="utf-8">		<meta http-equiv="X-UA-Compatible" content="IE=edge">    				<title>SmarTeam3D - 3D world closer to you| SmarTeam3D</title>		<meta name="description" content="3D world closer to you | car/character customization,real reproduction of objects,from simple to complex animations,3D image and video rendering">		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />    		<meta name="keywords"  content="3d,webgl,rendering,animation,modeling, games" />				<link rel="apple-touch-icon" sizes="57x57" href="/assets/general/apple-icon-57x57.png">		<link rel="apple-touch-icon" sizes="60x60" href="/assets/general/apple-icon-60x60.png">		<link rel="apple-touch-icon" sizes="72x72" href="/assets/general/apple-icon-72x72.png">		<link rel="apple-touch-icon" sizes="76x76" href="/assets/general/apple-icon-76x76.png">		<link rel="apple-touch-icon" sizes="114x114" href="/assets/general/apple-icon-114x114.png">		<link rel="apple-touch-icon" sizes="120x120" href="/assets/general/apple-icon-120x120.png">		<link rel="apple-touch-icon" sizes="144x144" href="/assets/general/apple-icon-144x144.png">		<link rel="apple-touch-icon" sizes="152x152" href="/assets/general/apple-icon-152x152.png">		<link rel="apple-touch-icon" sizes="180x180" href="/assets/general/apple-icon-180x180.png">		<link rel="icon" type="image/png" sizes="192x192"  href="/assets/general/android-icon-192x192.png">		<link rel="icon" type="image/png" sizes="32x32" href="/assets/general/favicon-32x32.png">		<link rel="icon" type="image/png" sizes="96x96" href="/assets/general/favicon-96x96.png">		<link rel="icon" type="image/png" sizes="16x16" href="/assets/general/favicon-16x16.png">		<link rel="manifest" href="/assets/general/manifest.json">		<meta name="msapplication-TileColor" content="#ffffff">		<meta name="msapplication-TileImage" content="/assets/general/ms-icon-144x144.png">		<meta name="theme-color" content="#ffffff">		 		<script src="https://code.jquery.com/jquery.js"></script>   		<script src="https://code.jquery.com/pep/0.4.3/pep.min.js"></script>  		<script src="/assets/libraries/babylon.v4.0.min.js"></script>		<style> 			html, body {				margin: 0; 				padding: 0;				overflow: hidden;			} 			#webGLwarning{				display: none; position: absolute;font-weight: bold;z-index: 100;  left: 24.3em; color: white; top: 4px;			}			#canvas{				position:absolute; height:100%; width: 100%; z-index: 4; touch-action : none; -ms-touch-action : none; cursor:move;			} 		</style>	</head> 	<body>   		<canvas id="canvas" style="touch-action:none" touch-action="none"></canvas> 	    <script>			var canvas = document.getElementById("canvas");			var engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });			var isMobile = false, scene;							_init();			function _init()			{				if (typeof(window.orientation) != "undefined") isMobile = true;				 				if (!webgl_detect()) return;								if (BABYLON.Engine.isSupported())				{					BABYLON.SceneLoader.ShowLoadingScreen = false;					BABYLON.Database.IDBStorageEnabled  = true;			 					if(isMobile) engine.setHardwareScalingLevel(.5);					scene = new BABYLON.Scene(engine);					scene.clearColor = new BABYLON.Color4(0.88, 0.88, 0.88, 1); 					scene.fogEnabled = false; 					var light = new BABYLON.PointLight("Omni", new BABYLON.Vector3(0, 0, -120), scene);					var camera = new BABYLON.ArcRotateCamera("ArcRotateCamera", -1.56, 1.4, 500, BABYLON.Vector3.Zero(), scene);					camera.lowerBetaLimit = camera.beta +(-10 * (Math.PI/180));					camera.upperBetaLimit = camera.beta +(10 * (Math.PI/180));  					camera.lowerRadiusLimit = camera.radius;camera.upperRadiusLimit = camera.radius;										scene.activeCamera = camera;      					camera.attachControl(canvas, true); 					importMesh();    					var godrays = new BABYLON.VolumetricLightScatteringPostProcess('godrays', 1.0, scene.activeCamera, null, 150, BABYLON.Texture.BILINEAR_SAMPLINGMODE, engine, false);					godrays.mesh.position = new BABYLON.Vector3(0, 10, 0);  					godrays.mesh.scaling = new BABYLON.Vector3(20, 30, 20);		 					scene.registerBeforeRender(function() {						camera.alpha +=0.003; 						godrays.mesh.position.z = -250*Math.sin(camera.alpha);						light.position = camera.position;					});					engine.runRenderLoop(function() { 						scene.render();					});				}			}  			window.addEventListener("resize", function() { engine.resize();});			window.addEventListener( "contextmenu", function(e) {e.preventDefault();}, false);			function webgl_detect() 			{				if (!!window.WebGLRenderingContext) 				{					var names = ["webgl2", "experimental-webgl2", "webgl", "experimental-webgl", "moz-webgl", "webkit-3d"];					var context = null;					for(var i=0;i<names.length;i++) 					{						context = canvas.getContext(names[i]);						if (context && typeof context.getParameter == "function") 							// WebGL is enabled							return true;   					}										// WebGL is supported, but disabled					return false;				} 				// WebGL not supported				return false;			} 			function importMesh()			{ 				BABYLON.SceneLoader.ImportMesh("", "assets/main/bbjs/", "titlu.babylon", scene, function (m) 				{ 					m[0].position = m[0].rotation = BABYLON.Vector3.Zero();					m[0].material.diffuseColor = BABYLON.Color3.FromHexString("#2CB8A5");										var titlu = new BABYLON.Mesh("titlu", scene); 					for(i=0;i<m.length;i++){ m[i].parent = titlu; }					titlu.rotation = new BABYLON.Vector3(0, Math.PI/2, -Math.PI/2);					titlu.position = new BABYLON.Vector3(-238, 64, 0);				});  				BABYLON.SceneLoader.ImportMesh("", "assets/main/bbjs/", "motto.babylon", scene, function (m) 				{		 					m[0].position = m[0].rotation = BABYLON.Vector3.Zero(); 					m[0].material.diffuseColor = BABYLON.Color3.FromHexString("#2CB8A5");										var motto = new BABYLON.Mesh("motto", scene);					for(i=0;i<m.length;++i){ m[i].parent = motto; }  					motto.rotation = new BABYLON.Vector3(0, Math.PI/2, -Math.PI/2);					motto.position = new BABYLON.Vector3(-238, -10, 0);   				});			}		</script>   	</body></html>
